<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e5322d">
<title>빠망아 도와줘!</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --red:#E5322D; --red-strong:#D42A25; --red-ink:#8F1D19; --red-deep:#5B1310;
  --blush:#FFF4F3; --tag:#FFF0EF;
  --ink:#141416; --ink-2:#3F3F46; --muted:#57575E; --muted-2:#6E6E76;
  --line:#EDEBEA; --line-2:#E4E2E1; --soft:#FAFAF9; --gray:#F4F4F5;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-0.02em}
a{color:inherit}
button{font-family:inherit;letter-spacing:inherit}
button,a,[role="button"]{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.band{background:var(--blush)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.hero{display:flex;flex-wrap:wrap;gap:0 48px;align-items:flex-start;padding-bottom:8px}
.hero-left{flex:1 1 480px;min-width:0}
.hero-right{flex:1 1 440px;min-width:0}
.top{position:relative;padding:20px 0 0;min-height:300px}
.pill{margin:0;display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;color:#C42A24}
h1{margin:22px 0 0;font-size:clamp(48px,15vw,84px);line-height:.98;font-weight:900;letter-spacing:-0.055em;color:var(--red);position:relative;z-index:1}
h1 span{display:block}
.lead{margin:18px 0 0;font-size:clamp(16px,4.6vw,20px);line-height:1.4;font-weight:600;color:var(--ink-2);position:relative;z-index:1;word-break:keep-all}
.lead span{display:inline-block;white-space:nowrap}
@media (max-width:599px){.lead span{display:block}}
.hero-mascot{position:absolute;right:-10px;top:30px;pointer-events:none}
.hero-mascot img{height:clamp(220px,62vw,340px);width:auto;display:block;transform-origin:50% 94%}
@media (min-width:600px) and (max-width:959px){.hero-mascot{right:4%}.top{min-height:360px}}
@media (max-width:360px){.chip{font-size:13px}.search button{padding:0 14px}.notice{font-size:13px}}

.search{position:relative;z-index:2;margin:-26px 0 0;padding:8px;background:#fff;border:1px solid #E7E5E4;border-radius:22px;display:flex;gap:8px;align-items:center}
.search svg{flex-shrink:0;margin-left:10px}
.search input{flex:1 1 auto;min-width:0;height:48px;border:0;border-radius:14px;padding:0 4px;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:transparent;letter-spacing:-0.02em;outline:none}
.search input::placeholder{color:#8A8A92}
.search:focus-within{border-color:var(--red-strong);box-shadow:0 0 0 4px rgba(229,50,45,.14)}
.search button{flex-shrink:0;height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--red-strong);color:#fff;font-size:16px;font-weight:800;cursor:pointer}

.notice{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--blush);display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.45;font-weight:600;color:var(--red-ink)}
.band .notice{background:#fff}
.notice svg{flex-shrink:0}

.block{padding-top:36px}
h2{margin:0 4px 14px;font-size:18px;font-weight:800;letter-spacing:-0.03em}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chip{height:42px;padding:0;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:14px;font-weight:700;letter-spacing:-0.03em;cursor:pointer}
.chip.on{background:var(--red-strong);border-color:var(--red-strong);color:#fff}

.map-wrap{position:relative}
.map-card{position:relative;z-index:1;border-radius:24px;background:var(--soft);border:1px solid #F0EEED;padding:14px 10px 10px}
.map-card svg{display:block;width:100%;height:auto;overflow:visible}
.map-hint{margin:8px 6px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.hero-right.block{padding-top:8px}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 4px 8px}
.map-card h2{margin:0;white-space:nowrap}
#infomap{max-width:560px;margin:0 auto}
@media (max-width:360px){.bub{font-size:12px;padding:6px 9px}.peek{width:40px;height:40px}.guide{gap:8px}.map-head h2{font-size:17px}}
.guide{display:flex;align-items:center;gap:10px;min-width:0}
.peek{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 70%,#FFE3E1,#FFC9C5);box-shadow:0 0 0 3px #fff,0 0 0 4px #F3D6D3,0 6px 14px -6px rgba(196,42,36,.45);overflow:hidden;transform-origin:50% 100%}
.peek img{width:100%;height:100%;display:block;transform:translateY(2px)}
.bub{position:relative;background:var(--ink);color:#fff;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:800;letter-spacing:-0.03em;white-space:nowrap;transform-origin:100% 50%}
.bub em{font-style:normal;color:#FF8A84}
.bub::after{content:"";position:absolute;right:-5px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--ink);border-right:0}

.region{cursor:pointer;outline:none}
.region path{fill:var(--tone);stroke:#fff;stroke-width:1.6;stroke-linejoin:round;transition:fill 160ms ease}
.region text{pointer-events:none;text-anchor:middle;font-family:inherit}
.region .nm{font-size:14px;font-weight:800;fill:var(--red-deep)}
.region .ct{font-size:12px;font-weight:700;fill:var(--red-ink)}
.region.eup path{fill:#E7E5E4}
.region.eup .nm{fill:#57575E}.region.eup .ct{fill:#6E6E76}
.region.dim{opacity:.35}
.region.on path{fill:var(--red);stroke-width:2}
.region.on text{fill:#fff}
.region.on{transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 10px 14px rgba(160,30,25,.38));animation:sel 480ms var(--ease-out) both}
.region:focus-visible path{stroke:var(--ink);stroke-width:2.4}
@media (hover:hover) and (pointer:fine){.region:not(.on):hover path{filter:brightness(.96)}}

/* results */
.results-wrap{padding-top:36px}
.status{margin:0;padding:0 4px 14px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;color:var(--muted);scroll-margin-top:16px}
.status.has{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-0.04em}
.status em{font-style:normal;color:var(--red-strong);font-variant-numeric:tabular-nums}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:12px}
.group-title{grid-column:1/-1;margin:14px 4px 2px;display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:800;letter-spacing:-0.03em}
.group-title span{font-size:14px;font-weight:600;color:var(--muted-2)}
.card{border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0;animation:cardIn 560ms var(--ease-out) both}
.card h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.04em;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--gray);border-radius:8px;padding:4px 8px;overflow-wrap:anywhere}
.tag.red{color:#B3231E;background:var(--tag)}
.addr,.menu{margin:0;font-size:14px;line-height:1.5;font-weight:500;color:var(--muted)}
.menu{color:var(--ink-2)}
.actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.btn{flex:0 0 auto;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.call{flex:1 1 auto;background:var(--ink);border-color:var(--ink);color:#fff}
@media (hover:hover) and (pointer:fine){.btn:not(.call):hover{border-color:var(--ink)}.chip:not(.on):hover{border-color:var(--ink)}}
#moreBtn{display:block;width:100%;max-width:360px;margin:16px auto 0;height:52px;border-radius:16px;border:1px solid var(--line-2);background:var(--soft);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
#moreBtn[hidden]{display:none}
footer p{margin:0;padding:48px 4px 40px;font-size:12px;line-height:1.7;font-weight:500;color:var(--muted-2)}

/* press feedback */
.chip,.btn,.search button,#moreBtn{transition:transform 140ms var(--ease-out),background-color 160ms ease,color 160ms ease,border-color 160ms ease}
.chip:active,.btn:active,.search button:active,#moreBtn:active{transform:scale(.97)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:translateY(48px) scale(.86) rotate(-8deg)}62%{opacity:1;transform:translateY(-8px) scale(1.03) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes hopA{0%{transform:none}35%{transform:translateY(-8px) rotate(-6deg)}65%{transform:translateY(2px)}100%{transform:none}}
@keyframes hopB{0%{transform:none}35%{transform:translateY(-8px) rotate(6deg)}65%{transform:translateY(2px)}100%{transform:none}}
@keyframes bubA{0%{opacity:0;transform:translateX(8px) scale(.8)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes bubB{0%{opacity:0;transform:translateX(8px) scale(.8)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes sel{0%{transform:scale(1)}55%{transform:scale(1.09)}100%{transform:scale(1.05)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1 span{animation:rise 760ms var(--ease-out) both}
h1 span+span{animation-delay:90ms}
.lead{animation:rise 760ms var(--ease-out) 200ms both}
.search{animation:rise 760ms var(--ease-out) 300ms both}
.hero-mascot{animation:popIn 950ms var(--ease-out) 220ms both}
.hero-mascot img{animation:sway 3.8s ease-in-out 1.3s infinite}
.peek.a{animation:hopA 520ms var(--ease-out)}
.peek.b{animation:hopB 520ms var(--ease-out)}
.bub.a{animation:bubA 420ms var(--ease-out) both}
.bub.b{animation:bubB 420ms var(--ease-out) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

/* wide screens */
@media (min-width:960px){
  .wrap{padding:0 40px}
  .hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 clamp(28px,4vw,48px)}
  .band{padding-bottom:56px}
  .top{min-height:0;padding-top:28px}
  h1{font-size:clamp(88px,8.6vw,112px);line-height:.95;letter-spacing:-0.06em}
  .lead{font-size:24px;margin:12px 0 42px}
  .hero-mascot{display:none}
  .search{margin:0}
  .hero-right.block{padding-top:72px}
  .peek{width:58px;height:58px}
  .bub{font-size:15px;padding:9px 13px}
  .map-head{margin:0 0 10px}
  .map-card{background:#fff;border-color:var(--line);border-radius:32px;padding:26px 26px 18px}
  .map-card h2{margin:0 0 6px;font-size:20px}
  .results-wrap{padding-top:72px}
  .status.has{font-size:30px}
  #results{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
}
</style>
</head>

    // 면마다 지도 색을 달리해 이웃한 면이 구분되게 한다(원본 지도의 색 묶음을 그대로 따름).
    const TONES = {
      "주천면": "#f6a7a2", "부귀면": "#f6a7a2", "백운면": "#f6a7a2",
      "용담면": "#fbc9c5", "안천면": "#fbc9c5",
      "정천면": "#fde3e1", "동향면": "#fde3e1",
      "상전면": "#fad0cc", "성수면": "#fad0cc", "마령면": "#fad0cc",
    };
    let mapData = null;   // data/map.json: 면별 윤곽선(SVG path)과 글자 위치
    const PAGE_SIZE = 30;

    let stores = [];
    let selectedMyeon = null;
    let currentList = [];
    let shown = 0;
    let tileCounts = null;   // 검색어가 있을 때 면별 결과 수 (없으면 null)

    const queryInput = document.getElementById("query");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const myeonWrap = document.getElementById("myeonButtons");
    const infomap = document.getElementById("infomap");
    const moreBtn = document.getElementById("moreBtn");
    const bubbleEl = document.getElementById("bubble");
    const peekEl = document.getElementById("peek");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------- 빠망이 반응 (말풍선 + 폴짝) ----------
    let flip = false;
    let lastReaction = "";
    function react(text) {
      if (!text) text = "어디로|가볼까?";
      if (text === lastReaction) return;
      lastReaction = text;
      flip = !flip;
      bubbleEl.hidden = false;
      bubbleEl.className = "bub " + (flip ? "a" : "b");
      peekEl.className = "peek " + (flip ? "a" : "b");
      bubbleEl.textContent = "";
      const parts = text.split("|");
      bubbleEl.appendChild(document.createTextNode(parts[0] + " "));
      const em = document.createElement("em");
      em.textContent = parts[1];
      bubbleEl.appendChild(em);
    }

    // ---------- 숫자 올라가기 ----------
    let tickRaf = 0;
    function tickTo(el, target) {
      cancelAnimationFrame(tickRaf);
      if (reduceMotion) { el.textContent = `${target}곳`; return; }
      const t0 = performance.now();
      const step = (t) => {
        const p = Math.min(1, (t - t0) / 650);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = `${Math.round(target * e)}곳`;
        if (p < 1) tickRaf = requestAnimationFrame(step);
      };
      tickRaf = requestAnimationFrame(step);
    }

    // ---------- 면 선택 / 지도 ----------

    function renderMyeon() {
      myeonWrap.innerHTML = "";
      MYEON.forEach((name) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (selectedMyeon === name ? " on" : "");
        btn.textContent = name;
        btn.setAttribute("aria-pressed", selectedMyeon === name);
        btn.addEventListener("click", () => selectMyeon(name));
        myeonWrap.appendChild(btn);
      });

      renderInfomap();
    }

    function renderInfomap() {
      infomap.innerHTML = "";
      if (!mapData) return;
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", mapData.viewBox);
      svg.setAttribute("role", "group");
      svg.setAttribute("aria-label", "진안군 면 지도");
      let selectedG = null;

      mapData.regions.forEach((r) => {
        const isEup = r.name === "진안읍";
        const count = tileCounts ? (tileCounts[r.name] || 0) : stores.filter((s) => s.myeon === r.name).length;
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", "region" + (isEup ? " eup" : "") + (selectedMyeon === r.name ? " on" : "") + (!isEup && tileCounts && count === 0 ? " dim" : ""));
        g.style.setProperty("--tone", TONES[r.name] || "#fde3e1");
        g.setAttribute("role", "button");
        g.setAttribute("tabindex", "0");
        g.setAttribute("aria-label", isEup ? "진안읍 사용 불가" : `${r.name} ${count}곳`);

        const path = document.createElementNS(NS, "path");
        path.setAttribute("d", r.d);
        const nm = document.createElementNS(NS, "text");
        nm.setAttribute("class", "nm");
        nm.setAttribute("x", r.lx);
        nm.setAttribute("y", r.ly - 2);
        nm.textContent = r.name;
        const ct = document.createElementNS(NS, "text");
        ct.setAttribute("class", "ct");
        ct.setAttribute("x", r.lx);
        ct.setAttribute("y", r.ly + 15);
        ct.textContent = isEup ? "사용 불가" : count + "곳";
        g.append(path, nm, ct);

        const act = () => {
          if (isEup) {
            showEmpty("진안읍에서는 빠망이 카드를 쓸 수 없습니다. 면 지역을 선택해 주세요.");
            react("");
            scrollToStatus(900);
          } else {
            selectMyeon(r.name);
          }
        };
        g.addEventListener("click", act);
        g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
        svg.appendChild(g);
        if (selectedMyeon === r.name) selectedG = g;
      });
      // 고른 면은 맨 위에 그려서 떠오르는 효과가 다른 면에 가리지 않게 한다.
      if (selectedG) svg.appendChild(selectedG);
      infomap.appendChild(svg);
    }
    function selectMyeon(name) {
      selectedMyeon = selectedMyeon === name ? null : name;
      queryInput.value = "";
      search();
      if (selectedMyeon) scrollToStatus(900);
    }

    let scrollTimer = 0, scrollRaf = 0;
    function scrollToStatus(delay = 0) {
      // 넓은 화면에서는 지도와 버튼이 한눈에 보이므로, 좁은 화면에서만 결과로 내려간다.
      if (window.matchMedia("(min-width: 960px)").matches) return;
      clearTimeout(scrollTimer); cancelAnimationFrame(scrollRaf);
      const go = () => {
        const target = statusEl.getBoundingClientRect().top + window.scrollY - 12;
        if (reduceMotion) { window.scrollTo(0, target); return; }
        const from = window.scrollY, dist = target - from;
        const dur = Math.min(1100, Math.max(650, Math.abs(dist) * 0.9));
        const t0 = performance.now();
        const ease = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const step = (t) => {
          const p = Math.min(1, (t - t0) / dur);
          window.scrollTo(0, from + dist * ease(p));
          if (p < 1) scrollRaf = requestAnimationFrame(step);
        };
        scrollRaf = requestAnimationFrame(step);
      };
      // 고른 면이 떠오르고 빠망이가 말하는 걸 본 다음 내려간다.
      if (delay && !reduceMotion) scrollTimer = setTimeout(go, delay); else go();
    }
    // 사용자가 직접 스크롤하면 자동 스크롤을 멈춘다.
    ["wheel", "touchstart"].forEach((ev) => window.addEventListener(ev, () => { clearTimeout(scrollTimer); cancelAnimationFrame(scrollRaf); }, { passive: true }));

    // ---------- 검색 ----------

    function categoryLabel(s) {
      return s.kcat ? s.kcat.replace(/^음식점 > /, "") : s.type;
    }

    // "부귀면", "부귀", "부귀면 카페"처럼 면 이름과 업종 검색어를 함께 쓸 수 있다.
    function findMyeon(token) {
      return MYEON.find((m) => m === token || m.replace("면", "") === token);
    }

    // 어떤 검색어든 상호·메뉴·세부 분류·업종·주소에서 찾고, 많이 일치할수록(상호 > 메뉴 > 분류 > 업종 > 주소) 위에 보여준다.
    // KEYWORDS는 "고기 → 식당·정육점"처럼 자주 쓰는 말을 업종으로 넓혀 주는 보조 장치일 뿐, 검색을 제한하지 않는다.
    // 한 글자 검색어("회", "빵")는 "사회적협동조합", "회관"처럼 상호 일부에 걸려 엉뚱한 결과가 많아서
    // 메뉴·세부 분류·업종 연결어에서만 찾는다.
    function scoreToken(store, token) {
      let score = 0;
      const exact = token.length > 1;
      if (exact && store.name.includes(token)) score += 10;
      if ((store.menu || "").includes(token)) score += 8;
      if ((store.kcat || "").includes(token)) score += 6;
      if (exact && store.type.includes(token)) score += 5;
      const categories = KEYWORDS[token];
      if (categories && categories.some((c) => store.categories.includes(c))) score += 3;
      if (exact && store.address.includes(token)) score += 1;
      return score;
    }

    function search() {
      const tokens = queryInput.value.trim().split(/\s+/).filter(Boolean);
      let myeon = selectedMyeon;
      const rest = [];

      tokens.forEach((t) => {
        const m = findMyeon(t);
        if (m && !myeon) myeon = m;
        else rest.push(t);
      });
      selectedMyeon = myeon;

      // 면을 고르지 않은 채 업종만 검색하면, 면마다 결과가 몇 곳인지 지도에 보여준다.
      tileCounts = null;

      if (rest.includes("진안읍")) {
        renderMyeon();
        showEmpty("진안읍에서는 빠망이 카드를 쓸 수 없습니다. 면 지역을 선택해 주세요.");
        react("");
        return;
      }
      if (!myeon && rest.length === 0) {
        renderMyeon();
        showEmpty("검색어를 입력하거나 면을 선택하세요.");
        react("");
        return;
      }

      let list = stores;
      if (rest.length) {
        list = list
          .map((s) => {
            const scores = rest.map((t) => scoreToken(s, t));
            return { s, score: scores.every((n) => n > 0) ? scores.reduce((a, b) => a + b, 0) : 0 };
          })
          .filter((x) => x.score > 0)
          .sort((a, b) => b.score - a.score)
          .map((x) => x.s);
        tileCounts = {};
        list.forEach((s) => { tileCounts[s.myeon] = (tileCounts[s.myeon] || 0) + 1; });
      }
      if (myeon) list = list.filter((s) => s.myeon === myeon);

      renderMyeon();
      render(list, myeon, rest.join(" "));
    }

    function showEmpty(message) {
      currentList = [];
      resultsEl.innerHTML = "";
      moreBtn.hidden = true;
      statusEl.classList.remove("has");
      statusEl.textContent = message;
    }

    // 면만 골랐을 때는 업종별로 묶고, 묶음 안에서는 이름 가나다순으로 보여준다.
    const GROUP_ORDER = ["식당", "카페", "정육점", "마트", "특산품", "미용실", "목욕탕", "주유소", "숙박", "병원", "약국", "의류", "농자재", "자동차", "교육", "기타"];
    let grouped = false;
    let groupCounts = {};
    let lastGroup = null;

    const GROUP_LABEL = { "카페": "카페·디저트" };

    // "음식점업(카페)"처럼 업종 문구에 '음식'이 들어 있어 식당으로도 분류된 카페를 카페로 따로 묶는다.
    // 한식·일반음식점을 함께 하는 가게(예: 커피+한식)는 식당에 둔다.
    function groupOf(s) {
      const k = s.kcat || "";
      const cafeName = /카페|까페|커피|cafe|coffee/i.test(s.name);
      // 만두·찐빵 제조·도매처럼 '빵' 때문에 카페로 분류된 업체는 카페로 보지 않는다.
      const cats = /제조|도매/.test(s.type) && !cafeName ? s.categories.filter((c) => c !== "카페") : s.categories;
      if (cats !== s.categories) return GROUP_ORDER.find((g) => cats.includes(g)) || "기타";
      const cafeLike = cafeName || /카페|까페|커피/.test(s.type) || /카페|제과|베이커리|디저트/.test(k);
      const restaurantType = /한식|일반음식|분식|식당|중식|일식|양식|치킨|피자|횟집|고기|갈비/.test(s.type);
      if ((s.categories.includes("카페") || /제과|베이커리|디저트/.test(k)) && cafeLike && (cafeName || !restaurantType)) {
        return "카페";
      }
      return GROUP_ORDER.find((g) => s.categories.includes(g)) || "기타";
    }

    function sortKey(s) {
      return s.name.replace(/^[\s()（）]*(주|유|농)[)）]\s*|^주식회사\s*/, "").trim();
    }

    function render(list, myeon, term) {
      grouped = Boolean(myeon) && !term;
      if (grouped) {
        list = list.slice().sort((a, b) =>
          GROUP_ORDER.indexOf(groupOf(a)) - GROUP_ORDER.indexOf(groupOf(b)) || sortKey(a).localeCompare(sortKey(b), "ko"));
        groupCounts = {};
        list.forEach((s) => { const g = groupOf(s); groupCounts[g] = (groupCounts[g] || 0) + 1; });
      }
      lastGroup = null;
      currentList = list;
      shown = 0;
      resultsEl.innerHTML = "";

      if (stores.length === 0) {
        showEmpty("가맹점 데이터를 불러오지 못했습니다.");
        return;
      }

      const where = [myeon, term && `'${term}'`].filter(Boolean).join(" ");
      statusEl.textContent = "";
      if (list.length) {
        statusEl.classList.add("has");
        statusEl.appendChild(document.createTextNode(`${where} 사용처 `));
        const n = document.createElement("em");
        statusEl.appendChild(n);
        tickTo(n, list.length);
        react(`${where}|${list.length}곳`);
      } else {
        statusEl.classList.remove("has");
        statusEl.textContent = "검색 결과가 없습니다. 다른 검색어로 찾아보세요.";
        react("");
      }

      showMore();
    }

    function showMore() {
      let i = 0;
      currentList.slice(shown, shown + PAGE_SIZE).forEach((s) => {
        if (grouped && groupOf(s) !== lastGroup) {
          lastGroup = groupOf(s);
          const title = document.createElement("h3");
          title.className = "group-title";
          title.textContent = GROUP_LABEL[lastGroup] || lastGroup;
          const n = document.createElement("span");
          n.textContent = groupCounts[lastGroup] + "곳";
          title.appendChild(n);
          resultsEl.appendChild(title);
        }
        const card = buildCard(s);
        card.style.animationDelay = Math.min(i, 8) * 50 + "ms";   // 처음 몇 장만 차례로, 나머지는 바로
        i += 1;
        resultsEl.appendChild(card);
      });
      shown = Math.min(shown + PAGE_SIZE, currentList.length);
      moreBtn.hidden = shown >= currentList.length;
      moreBtn.textContent = `더 보기 (${currentList.length - shown}곳 남음)`;
    }

    function makeLink(cls, text, href, external) {
      const a = document.createElement("a");
      a.className = cls;
      a.textContent = text;
      a.href = href;
      if (external) { a.target = "_blank"; a.rel = "noopener"; }
      return a;
    }

    const PHONE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';

    function buildCard(s) {
      const card = document.createElement("div");
      card.className = "card";

      const h2 = document.createElement("h2");
      h2.textContent = s.name;
      card.appendChild(h2);

      const tags = document.createElement("div");
      tags.className = "tags";
      const t1 = document.createElement("span");
      t1.className = "tag red";
      t1.textContent = s.myeon;
      const t2 = document.createElement("span");
      t2.className = "tag";
      t2.textContent = categoryLabel(s);
      tags.appendChild(t1);
      tags.appendChild(t2);
      card.appendChild(tags);

      const addr = document.createElement("p");
      addr.className = "addr";
      addr.textContent = s.address.replace(/^전북(특별자치도)? 진안군 /, "");
      card.appendChild(addr);

      if (s.menu) {
        const menu = document.createElement("p");
        menu.className = "menu";
        menu.textContent = `메뉴: ${s.menu}`;
        card.appendChild(menu);
      }

      const actions = document.createElement("div");
      actions.className = "actions";
      if (s.phone) {
        const call = makeLink("btn call", "", "tel:" + s.phone.replace(/[^0-9+]/g, ""));
        call.innerHTML = PHONE_ICON;
        call.appendChild(document.createTextNode(s.phone));
        call.setAttribute("aria-label", `전화 걸기 ${s.phone}`);
        actions.appendChild(call);
      }
      actions.appendChild(makeLink("btn", "기본정보", "https://search.naver.com/search.naver?query=" + encodeURIComponent("진안군 " + s.name), true));
      actions.appendChild(makeLink("btn", "길찾기", "https://map.naver.com/p/search/" + encodeURIComponent(s.address), true));
      card.appendChild(actions);
      return card;
    }

    document.getElementById("searchBtn").addEventListener("click", () => {
      selectedMyeon = null;
      search();
      queryInput.blur();   // 모바일에서 키보드를 닫아 결과가 보이게
      scrollToStatus();
    });
    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("searchBtn").click();
    });
    moreBtn.addEventListener("click", showMore);

    renderMyeon();
    Promise.all([
      fetch("data/stores.json").then((r) => r.json()),
      fetch("data/map.json").then((r) => r.json()).catch(() => null),   // 지도가 없어도 목록은 쓸 수 있게
    ])
      .then(([data, map]) => {
        stores = data;
        mapData = map;
        renderMyeon();
        statusEl.textContent = "검색어를 입력하거나 면을 선택하세요.";
      })
      .catch(() => {
        statusEl.textContent = "가맹점 데이터를 불러오지 못했습니다.";
      });
</script>
</body>
</html>
